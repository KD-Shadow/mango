[notification]
offset_x = 17

[plugin_settings."noctalia/wallhaven"]
browser_open_near_click = true

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell]
app_icon_colorize = true
corner_radius_scale = 2.0
font_family = "JetBrainsMono NFM"
settings_show_advanced = true
ui_scale = 0.90000000596046448

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    launcher_placement = "attached"
    polkit_placement = "attached"

[templates.nvim-base16]
input_path = "~/.config/nvim/lua/matugen-template.lua"
output_path = "~/.config/nvim/lua/matugen.lua"
post_hook = "pkill -SIGUSR1 nvim"

[theme]
builtin = "Rosé Pine"
community_palette = "Occult Umbral"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "ghostty", "kcolorscheme", "mango", "qt" ]
    community_ids = [ "libreoffice", "neovim", "vscode", "zed", "rofi", "zathura", "bat", "lazygit" ]
    enable_builtin_templates = true
    enable_community_templates = true

        [theme.templates.lite-xl]
        input_path = "/home/sh4dow/.config/noctalia/templates/lite-xl.lua"
        output_path = "~/.config/lite-xl/colors/matugen.lua"

        [theme.templates.litexl]
        input_path = "/home/sh4dow/.config/noctalia/templates/lite-xl.lua"
        output_path = "~/.config/lite-xl/colors/matugen.lua"

        [theme.templates.rmpc]
        input_path = "/home/sh4dow/.config/noctalia/templates/rmpc.ron"
        output_path = "~/.config/rmpc/themes/matugen.ron"

        [theme.templates.rofi]
        input_path = "/home/sh4dow/.config/noctalia/templates/rofi-colors.rasi"
        output_path = "/home/sh4dow/.config/rofi/colors.rasi"

[wallpaper]
directory = "/home/sh4dow/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/sh4dow/Pictures/wallpapers/wallhaven-ex.png"

    [wallpaper.last]
    path = "/home/sh4dow/Pictures/wallpapers/wallhaven-ex.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/sh4dow/Pictures/wallpapers/wallhaven-ex.png"

[weather]
enabled = false

[widget.clock]
format = "{:%I:%M %p}"

[widget.network]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
hide_when_empty = true
scale = 0.90000000000000002
